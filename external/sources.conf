# Upstream sources for the non-Wine DLLs that ship inside the neutron-wine runtime.
# Read by build-external.sh. One row per checkout:
#   <name>  <git url>  <commit>  <patch dir under patches/, or ->
#
# dxvk          our d3d11 (x64). DXVK v2.7.1-634 + patches/dxvk.
# dxvk-dxgi     our dxgi (x64): the same commit + patches/dxvk-dxgi, which carries only the two
#               DirectComposition bridge hooks the validated dxgi had (2026-07-23 build). The
#               rest of patches/dxvk's dxgi changes (bounded-acquire forwarding, stored
#               background color, tracing) never ran in daily use, so they do not ship.
# dxvk-stock    every other DXVK DLL (x64 d3d8/d3d9/d3d10core, all x86), unmodified. This is the
#               exact upstream commit the validated runtime used (v2.7.1-609).
# vkd3d-proton  our d3d12core + d3d12 (x64). vkd3d-proton v3.0.1-159 + patches/vkd3d-proton.
# vkd3d-x86     x86 d3d12 + d3d12core, the unmodified v3.0.1 release.
# nvcuda        our CUDA wrapper. SveSop/nvcuda + patches/nvcuda.
# nvenc         nvcuvid + nvencodeapi64, unmodified.
# wine-nvoptix  nvoptix, unmodified (v0.5).
# dxvk-nvapi    nvapi64 + nvofapi64 (x64), nvapi (x86). The v0.9.2 release + patches/dxvk-nvapi: Sveinar
#               Søpler's 11 commits from SveSop/dxvk-nvapi (69998887, the build the validated runtime
#               used; no longer on any branch since he rebased them onto newer upstream).

